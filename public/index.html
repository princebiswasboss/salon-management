<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luxe Haven | Salon Booking & Management System</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/views.css">
</head>
<body>
  <div id="app-container">

    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="brand-section">
        <div class="brand-logo-icon">✦</div>
        <div class="brand-text">
          <h1>Luxe Haven</h1>
          <p id="sidebar-role-subtitle">Salon & Spa</p>
        </div>
      </div>

      <nav class="nav-menu" id="main-nav-menu">
        <!-- Admin Views -->
        <a href="#dashboard" class="nav-link admin-nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>

        <a href="#bookings" class="nav-link admin-nav-item" data-view="bookings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Bookings (Admin)</span>
        </a>

        <a href="#queue" class="nav-link admin-nav-item" data-view="queue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Walk-in Queue</span>
          <span class="nav-badge" id="sidebar-queue-badge" style="display:none;">0</span>
        </a>

        <!-- Customer & General Views -->
        <a href="#portal" class="nav-link" data-view="portal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
          <span>Book a Slot</span>
        </a>

        <a href="#my-bookings" class="nav-link" data-view="my-bookings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
          <span>My Appointments</span>
        </a>

        <a href="#services" class="nav-link" data-view="services">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>Services Catalog</span>
        </a>

        <a href="#staff" class="nav-link" data-view="staff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          <span>Stylists & Team</span>
        </a>

        <a href="#customers" class="nav-link admin-nav-item" data-view="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Clients (Admin)</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="portal-switch-card" id="sidebar-account-card">
          <div>
            <div class="title" id="sidebar-auth-user-name">Guest Customer</div>
            <div class="desc" id="sidebar-auth-user-role">Not signed in</div>
          </div>
          <button class="btn btn-outline btn-sm" id="btn-sidebar-auth-action">Login</button>
        </div>
      </div>
    </aside>

    <!-- Main Content Application -->
    <main class="app-main" id="app-main">
      <!-- Top Sticky Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-nav-toggle" id="btn-mobile-menu" aria-label="Toggle navigation menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="header-title-box">
            <h2 id="header-view-title">Dashboard</h2>
            <p id="header-view-desc">Salon key metrics, bookings & queue status</p>
          </div>
        </div>

        <div class="header-right">
          <!-- Auth Status & Controls -->
          <div id="header-auth-container" style="display:flex; align-items:center; gap:10px;">
            <!-- Rendered dynamically by app.js -->
          </div>

          <!-- Light / Dark Theme Switcher -->
          <button class="btn-theme-toggle" id="btn-theme-toggle" aria-label="Toggle Dark / Light Theme" title="Switch Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>

      <!-- View Dynamic Content -->
      <div class="content-body" id="main-content"></div>
    </main>

  </div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- ES Module Application Entrypoint -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
